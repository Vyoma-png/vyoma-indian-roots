<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VYOMA - Indian Roots</title>
    <!-- Dependencies: Three.js for 3D, GSAP for smooth animations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <!-- Sketchfab API Script -->
    <script type="text/javascript" src="https://static.sketchfab.com/api/sketchfab-viewer-1.12.1.js"></script>
    <!-- Premium Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,900;1,900&family=Inter:wght@300;400;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold-gradient: linear-gradient(135deg, #BF953F 0%, #FCF6BA 25%, #B38728 50%, #FBF5B7 75%, #AA771C 100%);
            --gold-solid: #B38728;
            --off-white: #f1ede8;
            --dark-overlay: rgba(10, 10, 10, 0.95);
        }

        body, html {
            margin: 0; padding: 0; width: 100%; overflow-x: hidden;
            background: #ffffff; font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        /* Canvas Stage */
        #canvas-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100vh;
            z-index: 5; transition: opacity 1.2s ease;
        }

        /* Temple Stage (Home Page) */
        #temple-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100vh;
            z-index: 2; opacity: 0; transition: opacity 1.2s ease; background: #ffffff;
        }

        #temple-iframe { width: 100%; height: 100%; border: 0; outline: none; }

        /* Main Page Stage */
        #main-page-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100vh;
            z-index: 100; pointer-events: none; opacity: 0; visibility: hidden;
            transition: opacity 1.2s ease;
            display: flex;
            flex-direction: column;
        }

        .scroll-container { position: relative; height: 2000vh; z-index: 10; }

        .overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100vh;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            pointer-events: none; z-index: 20;
        }

        .brand-container { text-align: center; display: flex; flex-direction: column; align-items: center; }

        .main-title {
            font-size: clamp(2.5rem, 10vw, 7rem); font-weight: 900; margin: 0; line-height: 1.1;
            background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            letter-spacing: -0.02em; filter: drop-shadow(0px 2px 10px rgba(179, 135, 40, 0.3));
        }

        .main-title.final { font-family: 'Playfair Display', serif; letter-spacing: -0.05em; }
        .divider { height: 2px; background: var(--gold-gradient); width: 40%; margin-top: 1.5rem; opacity: 0.8; }

        .sub-text {
            margin-top: 1.5rem; font-size: clamp(0.9rem, 2vw, 1.4rem); color: var(--gold-solid);
            text-transform: uppercase; letter-spacing: 0.8em; font-style: italic; font-family: 'Playfair Display', serif;
        }

        .quote-container { position: absolute; bottom: 12%; text-align: center; max-width: 600px; padding: 0 20px; font-family: 'Playfair Display', serif; }
        .quote { font-size: 1.2rem; color: #5b6e8a; line-height: 1.6; font-style: italic; }

        .progress-bar { position: fixed; top: 0; left: 0; height: 4px; background: var(--gold-gradient); z-index: 150; width: 0%; }
        .frame { position: fixed; inset: 0; border: clamp(15px, 4vw, 40px) solid rgba(255, 255, 255, 0.4); pointer-events: none; z-index: 50; backdrop-blur: 0.5px; }

        /* Modal */
        #product-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 200; background: var(--dark-overlay); display: flex; align-items: center; justify-content: center;
            opacity: 0; visibility: hidden; transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1); backdrop-filter: blur(15px);
        }

        #product-modal.active { opacity: 1; visibility: visible; }
        .modal-content { background: #fff; width: 90%; max-width: 1000px; display: flex; border-radius: 2px; transform: translateY(50px); transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1); overflow: hidden; }
        #product-modal.active .modal-content { transform: translateY(0); }
        .modal-image { width: 55%; height: 75vh; }
        .modal-image img { width: 100%; height: 100%; object-fit: cover; }
        .modal-info { width: 45%; padding: clamp(20px, 5vw, 60px); display: flex; flex-direction: column; justify-content: center; }
        .modal-info h3 { font-family: 'Playfair Display', serif; font-size: clamp(1.8rem, 4vw, 2.5rem); margin: 0; color: #111; }
        .price { font-size: clamp(1.2rem, 3vw, 1.8rem); margin-top: 15px; color: var(--gold-solid); font-weight: 900; }
        .desc { font-size: 0.9rem; color: #666; margin-top: 30px; line-height: 1.7; }
        .close-btn { position: absolute; top: 20px; right: 20px; cursor: pointer; padding: 10px; font-weight: 900; color: #000; z-index: 10; }

        .editorial-ui { width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: space-between; padding: clamp(30px, 6vw, 60px); box-sizing: border-box; }
        .nav-text { font-family: 'Playfair Display', serif; font-size: clamp(0.7rem, 2vw, 1rem); letter-spacing: 0.4em; text-transform: uppercase; color: var(--gold-solid); }

        /* Global Footer - Fixed Button Box Style */
        .vyoma-global-footer {
            position: fixed;
            bottom: clamp(20px, 5vw, 30px);
            left: 50%;
            transform: translateX(-50%);
            z-index: 120;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(179, 135, 40, 0.4);
            padding: 10px 24px;
            border-radius: 50px; /* Pill/Button Box shape */
            text-align: center;
            font-family: 'Playfair Display', serif;
            color: var(--gold-solid);
            font-size: clamp(0.6rem, 1.5vw, 0.85rem);
            letter-spacing: 0.15em;
            text-transform: uppercase;
            white-space: nowrap;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            pointer-events: auto;
            transition: opacity 0.5s ease;
        }

        .vyoma-global-footer:hover {
            border-color: var(--gold-solid);
            background: rgba(255, 255, 255, 0.2);
        }

        @media (max-width: 768px) {
            .modal-content { flex-direction: column; max-height: 90vh; overflow-y: auto; }
            .modal-image { width: 100%; height: 40vh; }
            .modal-info { width: 100%; padding: 30px; }
            .vyoma-global-footer { width: 85%; white-space: normal; padding: 12px 20px; line-height: 1.4; border-radius: 20px; }
        }

        #sky-bg { position: fixed; inset: 0; background: linear-gradient(135deg, #bae6fd 0%, #fbcfe8 50%, #ffffff 100%); z-index: 0; }
    </style>
</head>
<body>

    <div id="sky-bg"></div>
    <div class="progress-bar" id="progressBar"></div>
    <div class="frame"></div>

    <!-- Global Footer requested as "button box" for entire website -->
    <div class="vyoma-global-footer">
        @2026 vyoma • this is made to promote indian tradition
    </div>

    <div id="canvas-container"></div>
    <div id="temple-container">
        <iframe src="" id="temple-iframe" allow="autoplay; fullscreen; vr" allowfullscreen></iframe>
    </div>

    <!-- Main Page UNESCO UI -->
    <div id="main-page-container">
        <div class="editorial-ui">
            <div class="nav-text">Vyoma • Heritage Collection</div>
            <div class="nav-text" style="text-align: right;">Sanskriti • 2026</div>
        </div>
    </div>

    <!-- Modal -->
    <div id="product-modal">
        <div class="modal-content">
            <div class="close-btn" onclick="closeModal()">✕</div>
            <div class="modal-image"><img id="modal-img" src=""></div>
            <div class="modal-info">
                <h3 id="modal-title">Heritage</h3>
                <div class="price" id="modal-price">₹ --</div>
                <div class="desc" id="modal-desc">Craftsmanship details.</div>
            </div>
        </div>
    </div>

    <div class="scroll-container">
        <div class="overlay">
            <div class="brand-container" id="brandBlock">
                <h1 class="main-title" id="languageText">व्योम</h1>
                <div class="divider"></div>
                <p class="sub-text">Indian roots</p>
            </div>
            <div class="quote-container" id="quoteBlock">
                <p class="quote">"Space, the beginning and the end. <br> Our roots are the stars we carry within."</p>
            </div>
        </div>
    </div>

    <script>
        // --- LANGUAGES ---
        const languages = [
            { text: "व्योम", lang: "Sanskrit" }, { text: "వ్యోమ", lang: "Telugu" },
            { text: "व्योम", lang: "Hindi" }, { text: "ವ್ಯೋಮ", lang: "Kannada" },
            { text: "வியோமா", lang: "Tamil" }, { text: "વ્યોમા", lang: "Gujarati" },
            { text: "व्योమా", lang: "Marathi" }, { text: "VYOMA", lang: "English" }
        ];

        let langIndex = 0, isFinal = false;
        const textElement = document.getElementById('languageText');
        const brandBlock = document.getElementById('brandBlock');
        const quoteBlock = document.getElementById('quoteBlock');
        const progressBar = document.getElementById('progressBar');
        const canvasContainer = document.getElementById('canvas-container');
        const templeContainer = document.getElementById('temple-container');
        const mainPage = document.getElementById('main-page-container');

        function cycleLanguages() {
            if (langIndex < languages.length - 1) {
                langIndex++;
                gsap.to(textElement, { opacity: 0, y: -10, duration: 0.4, onComplete: () => {
                    textElement.innerText = languages[langIndex].text;
                    if (langIndex === languages.length - 1) { isFinal = true; textElement.classList.add('final'); }
                    gsap.fromTo(textElement, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.4 });
                    setTimeout(cycleLanguages, 800);
                }});
            }
        }
        setTimeout(cycleLanguages, 800);

        // --- SKETCHFAB ---
        let skfbApi = null;
        const client = new Sketchfab(document.getElementById('temple-iframe'));
        client.init('25f0176668004faa98ec351e04e58920', {
            success: (api) => { skfbApi = api; api.start(); },
            autostart: 1, preload: 1, transparent: 1, ui_hint: 0, ui_controls: 0, ui_watermark: 0, navigation: 'none' 
        });

        // --- 3D SCENE ---
        let scene, camera, renderer, earthGroup, cloudMeshes = [], forestItems = [], galleryGroup;
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        const collection = [
            { title: "Zardosi Velvet Sherwani", price: "₹85,000", img: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS1FcMqYgrBrGzrvj-rFtjOXXAkAB2zi4cjcQ&s", desc: "Premium silk-velvet with hand-done Zardosi embroidery." },
            { title: "Kanjivaram Gold Silk", price: "₹42,500", img: "https://5.imimg.com/data5/ECOM/Default/2024/1/376392464/OU/XX/VN/28249966/pure-kanjeevaram-silk-maharani-peach-colorful-saree-675818.jpg", desc: "Authentic zari motifs on pure temple-weave silk." },
            { title: "Heritage Silk Bandhgala", price: "₹38,000", img: "https://cdn.shopify.com/s/files/1/0636/0134/4666/files/black_jodhpuri_suit_for_men_with_silver_floral_and_bird-sg356334-1_1.jpg?v=1758267127", desc: "Heavy raw silk with bespoke gold buttons." },
            { title: "Banarasi Handloom Drape", price: "₹54,999", img: "https://tilfi.com/cdn/shop/products/SSATAPK10494OldRose_Lakshmi_PureSoftSatinPeacockFigureTanchoiSaree255_2048x.jpg?v=1671980152", desc: "Kadhwa woven saree with real silver zari." }
        ];

        function initThree() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            canvasContainer.appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0xffffff, 0.95));
            const sun = new THREE.DirectionalLight(0xfff4e0, 1.8); sun.position.set(10, 20, 10); scene.add(sun);

            earthGroup = new THREE.Group();
            earthGroup.add(new THREE.Mesh(new THREE.SphereGeometry(2, 64, 64), new THREE.MeshPhongMaterial({ color: 0x002d62, shininess: 80, specular: 0x4488ff })));
            const landGeom = new THREE.IcosahedronGeometry(2.01, 24);
            const landMat = new THREE.MeshPhongMaterial({ color: 0x14532d });
            const pos = landGeom.attributes.position;
            for (let i = 0; i < pos.count; i++) {
                const v = new THREE.Vector3().fromBufferAttribute(pos, i);
                v.setLength(Math.sin(v.x * 2.5) * Math.cos(v.y * 2.5) < 0.1 ? 1.98 : 2.02 + Math.random() * 0.02);
                pos.setXYZ(i, v.x, v.y, v.z);
            }
            earthGroup.add(new THREE.Mesh(landGeom, landMat));
            scene.add(earthGroup);

            const loader = new THREE.TextureLoader();
            const cloudTex = [loader.load('cloud-1.avif'), loader.load('cloud-2.avif'), loader.load('cloud-3.avif')];
            for (let i = 0; i < 50; i++) {
                const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: cloudTex[i % 3], transparent: true, opacity: 0.4 }));
                const angle = Math.random() * Math.PI * 2, r = 4.5 + Math.random() * 18, y = (Math.random() - 0.5) * 50; 
                sprite.position.set(Math.cos(angle) * r, y, Math.sin(angle) * r);
                sprite.scale.set(5, 2.5, 1); scene.add(sprite); cloudMeshes.push({ mesh: sprite, orbit: r, speed: 0.0005, angle });
            }

            const treeFoundationTex = [loader.load('tree1.png'), loader.load('tree5.png')];
            const treeSmallTex = [loader.load('tree2.png'), loader.load('tree3.png'), loader.load('tree4.png')];
            treeFoundationTex.forEach((tex, i) => {
                const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true }));
                sprite.position.set(i * 4 - 2, -3.4, 6); sprite.scale.set(14, 6, 1); scene.add(sprite); forestItems.push(sprite);
            });
            for (let i = 0; i < 10; i++) {
                const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: treeSmallTex[i % treeSmallTex.length], transparent: true }));
                sprite.position.set((Math.random() - 0.5) * 10, -2.0, 7 + Math.random() * 2); sprite.scale.set(0.8, 1, 1); scene.add(sprite); forestItems.push(sprite);
            }

            // Gallery Section
            galleryGroup = new THREE.Group(); galleryGroup.visible = false; scene.add(galleryGroup);
            const pillarMat = new THREE.MeshPhongMaterial({ color: 0xe8e2d9, flatShading: true, shininess: 20 });
            
            const isMobile = window.innerWidth < 768;
            const spacingX = isMobile ? 1.5 : 2.5;

            collection.forEach((p, i) => {
                const pillarGroup = new THREE.Group();
                const pillar = new THREE.Mesh(new THREE.BoxGeometry(2, 10, 1), pillarMat);
                pillarGroup.add(pillar);

                const tex = loader.load(p.img);
                const art = new THREE.Mesh(new THREE.PlaneGeometry(1.8, 2.5), new THREE.MeshBasicMaterial({ map: tex }));
                art.position.set(0, 1.5, 0.51);
                art.userData = { id: i };
                pillarGroup.add(art);

                pillarGroup.position.set((i % 2 === 0 ? -spacingX : spacingX), -i * 8, 0);
                galleryGroup.add(pillarGroup);
            });

            camera.position.z = 10;
            window.addEventListener('click', onCanvasClick);
            window.addEventListener('touchstart', (e) => { if(e.touches.length > 0) onCanvasClick(e.touches[0]); });
        }

        function onCanvasClick(event) {
            if (!galleryGroup.visible) return;
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(galleryGroup.children, true);
            if (intersects.length > 0) {
                const clickedObj = intersects.find(o => o.object.userData.id !== undefined);
                if (clickedObj) openModal(collection[clickedObj.object.userData.id]);
            }
        }

        function openModal(data) {
            document.getElementById('modal-img').src = data.img;
            document.getElementById('modal-title').innerText = data.title;
            document.getElementById('modal-price').innerText = data.price;
            document.getElementById('modal-desc').innerText = data.desc;
            document.getElementById('product-modal').classList.add('active');
        }

        function closeModal() { document.getElementById('product-modal').classList.remove('active'); }

        function animate() {
            requestAnimationFrame(animate);
            const totalH = document.body.scrollHeight - window.innerHeight;
            const scroll = window.scrollY / totalH;
            progressBar.style.width = (scroll * 100) + "%";

            if (scroll < 0.3) {
                const s = scroll / 0.3;
                camera.position.set(0, s * 1.3, 10 - s * 8.8); camera.lookAt(0, 0, 0);
                canvasContainer.style.opacity = "1"; templeContainer.style.opacity = "0"; mainPage.style.opacity = "0";
                earthGroup.visible = true; galleryGroup.visible = false;
            } 
            else if (scroll < 0.65) {
                const s = (scroll - 0.3) / 0.35; 
                canvasContainer.style.opacity = Math.max(0, 1 - s * 2.5);
                templeContainer.style.opacity = scroll < 0.6 ? 1 : Math.max(0, 1 - (scroll-0.6)*10); 
                mainPage.style.opacity = "0";
                if (skfbApi) skfbApi.setCameraLookAt([0, 200 - (s*150), 500 - (s*450)], [0, 0, 100 - (s * 100)], 0);
            }
            else {
                const s = (scroll - 0.65) / 0.35;
                templeContainer.style.opacity = "0"; canvasContainer.style.opacity = "1";
                mainPage.style.opacity = "1"; mainPage.style.visibility = "visible"; mainPage.style.pointerEvents = "auto";
                earthGroup.visible = false; galleryGroup.visible = true;

                const zoomFactor = window.innerWidth < 768 ? 8.5 : 7.5;
                const targetY = 2 - (s * 35); 
                camera.position.set(0, targetY, zoomFactor);
                camera.lookAt(0, targetY - 1, 0);
            }

            earthGroup.rotation.y += 0.0009;
            cloudMeshes.forEach(c => {
                c.angle += c.speed; c.mesh.position.x = Math.cos(c.angle) * c.orbit; c.mesh.position.z = Math.sin(c.angle) * c.orbit;
                c.mesh.material.opacity = Math.min(0.4, Math.abs(camera.position.z - c.mesh.position.z) * 0.08);
            });
            forestItems.forEach(el => { el.material.opacity = Math.max(0, Math.min(1, (camera.position.z - el.position.z) * 0.45)); });

            if (isFinal) {
                const vProg = Math.max(0, (scroll - 0.25) / 0.15);
                brandBlock.style.opacity = Math.max(0, 1 - vProg);
                brandBlock.style.transform = `translateY(${vProg * 100}px)`;
            }
            quoteBlock.style.opacity = scroll < 0.2 ? 0 : scroll < 0.25 ? (scroll - 0.2) / 0.05 : scroll < 0.35 ? 1 : 1 - (scroll - 0.35) / 0.05;

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight);
            const isMobile = window.innerWidth < 768;
            const spacingX = isMobile ? 1.5 : 2.5;
            galleryGroup.children.forEach((group, i) => { group.position.x = (i % 2 === 0 ? -spacingX : spacingX); });
        });

        initThree(); animate();
    </script>
</body>
</html>
